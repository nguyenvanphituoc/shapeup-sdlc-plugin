  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/><circle cx="39" cy="18" r="5.5" fill="#febc2e"/><circle cx="58" cy="18" r="5.5" fill="#28c840"/>
  <text x="317" y="23" fill="#7d8590" font-size="12" text-anchor="middle">shapeup-sdlc — sandbox-guard</text>
  <text class="l l0" x="22" y="72" fill="#7d8590">$ claude</text>
  <text class="l l1" x="22" y="93" fill="#f0f6fc">&gt; /ship "add dark mode"</text>
  <text class="l l3" x="22" y="135" fill="#7d8590">  GATE L0   intake + config ................. ok</text>
  <text class="l l4" x="22" y="156" fill="#7d8590">  GATE L1a  orient (code surface, risk) ..... ok</text>
  <text class="l l5" x="22" y="177" fill="#7d8590">  GATE L1a.5 wiring map: 4 use cases ........ ok</text>
  <text class="l l6" x="22" y="198" fill="#7d8590">  GATE L1b  board: 4 tasks .................. ok</text>
  <text class="l l8" x="22" y="240" fill="#7d8590">  BUILD  scope tokens   substrate: src/theme/*.ts</text>
  <text class="l l10" x="22" y="282" fill="#f0f6fc">&gt; the worker decides billing needs a tweak too</text>
  <text class="l l11" x="22" y="303" fill="#7d8590">  Edit(src/billing/charge.ts)</text>
  <text class="l l13" x="22" y="345" fill="#ff7b72">  ⛔ PreToolUse hook — sandbox-guard   DENIED</text>
  <text class="l l14" x="22" y="366" fill="#c9d1d9">     Sandbox guard (PA3) — no live order's substrate covers these</text>
  <text class="l l15" x="22" y="387" fill="#c9d1d9">     writes: src/billing/charge.ts is outside every live order's</text>
  <text class="l l16" x="22" y="408" fill="#c9d1d9">     allowed scopes If this write legitimately crosses scopes, the</text>
  <text class="l l17" x="22" y="429" fill="#c9d1d9">     order's substrate needs to be expanded (e.g. via ba --remap).</text>
  <text class="l l19" x="22" y="471" fill="#d2a8ff">  ↑ verbatim stdout from hooks/sandbox-guard.mjs.</text>
  <text class="l l20" x="22" y="492" fill="#d2a8ff">    Not a prompt. A script that read the order's own</text>
  <text class="l l21" x="22" y="513" fill="#d2a8ff">    substrate and named the path it does not cover.</text>
  <text class="l l23" x="22" y="555" fill="#f0f6fc">&gt; back inside the scope</text>
  <text class="l l24" x="22" y="576" fill="#3fb950">  Edit(src/theme/tokens.ts) ......... ✅ permitted</text>
  <text class="l l26" x="22" y="618" fill="#3fb950">  BUILD  scope tokens ............... ✅ T0 green</text>
  <text class="l l27" x="22" y="639" fill="#79c0ff">  hill 4/4 · derived from T0 artifacts, not self-report</text>
  <rect class="cur" x="22" y="650" width="8.7" height="14" fill="#3fb950"/>
</svg>
