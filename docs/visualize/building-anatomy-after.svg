<svg width="100%" viewBox="0 0 680 664" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>The building skill after: a router that points at one activity file per phase row, grouped by phase</title>
  <desc>SKILL.md is a router of sixteen phase rows. Each row points at one activity file, and the files are grouped into five folders in the order a run reaches them: intake, plan, build, ship and retro. Four shared files (contract, orders, gates, guidance) and the reference library sit under all of them. A dashed boundary marks what the structural test checks. The kernel and hooks underneath hold the five mechanisms and are unchanged.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    :root {
      --hair: #888780; --lbl: #444441; --lbl2: #5F5E5A;
      --n-fill: #F1EFE8; --n-ink: #444441; --n-ink2: #5F5E5A;
      --c-fill: #FAECE7; --c-edge: #993C1D; --c-ink: #712B13; --c-ink2: #993C1D;
      --t-fill: #E1F5EE; --t-edge: #0F6E56; --t-ink: #085041; --t-ink2: #0F6E56;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --hair: #888780; --lbl: #D3D1C7; --lbl2: #B4B2A9;
        --n-fill: #2C2C2A; --n-ink: #D3D1C7; --n-ink2: #B4B2A9;
        --c-fill: #712B13; --c-edge: #F0997B; --c-ink: #F5C4B3; --c-ink2: #F0997B;
        --t-fill: #085041; --t-edge: #5DCAA5; --t-ink: #9FE1CB; --t-ink2: #5DCAA5;
      }
    }
    .bound { fill: none; stroke: var(--hair); stroke-width: .5; stroke-dasharray: 4 4; }
    .cont  { fill: none; stroke: var(--hair); stroke-width: .5; }
    .box-n { fill: var(--n-fill); stroke: var(--hair); stroke-width: .5; }
    .box-c { fill: var(--c-fill); stroke: var(--c-edge); stroke-width: 1; stroke-dasharray: 4 3; }
    .box-t { fill: var(--t-fill); stroke: var(--t-edge); stroke-width: .5; }
    .edge  { fill: none; stroke: var(--hair); stroke-width: .5; }
    .lbl   { fill: var(--lbl);  font: 500 14px system-ui, sans-serif; }
    .lbl2  { fill: var(--lbl2); font: 400 12px system-ui, sans-serif; }
    .tn    { fill: var(--n-ink);  font: 500 14px system-ui, sans-serif; }
    .tn2   { fill: var(--n-ink2); font: 400 12px system-ui, sans-serif; }
    .tc2   { fill: var(--c-ink);  font: 400 12px system-ui, sans-serif; }
    .tt    { fill: var(--t-ink);  font: 500 14px system-ui, sans-serif; }
    .tt2   { fill: var(--t-ink2); font: 400 12px system-ui, sans-serif; }
    /* Staged reveal, containers before contents, in the order a run reaches them. It plays
       once; the markup itself is the finished picture. */
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: no-preference) {
      .r  { animation: reveal .45s ease-out both; }
      .d1 { animation-delay: .2s; }  .d2 { animation-delay: .4s; }
      .d3 { animation-delay: .6s; }  .d4 { animation-delay: .8s; }
      .d5 { animation-delay: 1s; }   .d6 { animation-delay: 1.2s; }
      .d7 { animation-delay: 1.4s; }
    }
  </style>
  <g class="r">
    <rect class="bound" x="40" y="20" width="600" height="528" rx="16"/>
    <text class="lbl2" x="60" y="40" text-anchor="start" dominant-baseline="central">skills/building · every row, file and header checked by npm test</text>
  </g>
  <g class="r d1">
    <rect class="box-n" x="60" y="56" width="130" height="328" rx="8"/>
    <text class="tn" x="125" y="202" text-anchor="middle" dominant-baseline="central">SKILL.md</text>
    <text class="tn2" x="125" y="222" text-anchor="middle" dominant-baseline="central">the router</text>
    <text class="tn2" x="125" y="240" text-anchor="middle" dominant-baseline="central">16 phase rows</text>
  </g>
  <line class="edge r d2" x1="190" y1="84" x2="220" y2="84" marker-end="url(#arrow)"/>
  <g class="r d2">
    <rect class="box-t" x="230" y="56" width="390" height="56" rx="8"/>
    <text class="tt" x="246" y="74" text-anchor="start" dominant-baseline="central">intake/</text>
    <text class="tt2" x="246" y="94" text-anchor="start" dominant-baseline="central">open-run · language · preservation</text>
  </g>
  <line class="edge r d3" x1="190" y1="152" x2="220" y2="152" marker-end="url(#arrow)"/>
  <g class="r d3">
    <rect class="box-t" x="230" y="124" width="390" height="56" rx="8"/>
    <text class="tt" x="246" y="142" text-anchor="start" dominant-baseline="central">plan/</text>
    <text class="tt2" x="246" y="162" text-anchor="start" dominant-baseline="central">substep · requirements · spec · wire · scopes</text>
  </g>
  <line class="edge r d4" x1="190" y1="220" x2="220" y2="220" marker-end="url(#arrow)"/>
  <g class="r d4">
    <rect class="box-t" x="230" y="192" width="390" height="56" rx="8"/>
    <text class="tt" x="246" y="210" text-anchor="start" dominant-baseline="central">build/</text>
    <text class="tt2" x="246" y="230" text-anchor="start" dominant-baseline="central">round · dispatch and scope if stage 5 holds</text>
  </g>
  <line class="edge r d5" x1="190" y1="288" x2="220" y2="288" marker-end="url(#arrow)"/>
  <g class="r d5">
    <rect class="box-t" x="230" y="260" width="390" height="56" rx="8"/>
    <text class="tt" x="246" y="278" text-anchor="start" dominant-baseline="central">ship/</text>
    <text class="tt2" x="246" y="298" text-anchor="start" dominant-baseline="central">census · report</text>
  </g>
  <line class="edge r d6" x1="190" y1="356" x2="220" y2="356" marker-end="url(#arrow)"/>
  <g class="r d6">
    <rect class="box-t" x="230" y="328" width="390" height="56" rx="8"/>
    <text class="tt" x="246" y="346" text-anchor="start" dominant-baseline="central">retro/</text>
    <text class="tt2" x="246" y="366" text-anchor="start" dominant-baseline="central">retro · scan · research</text>
  </g>
  <g class="r d7">
    <rect class="box-n" x="60" y="404" width="560" height="56" rx="8"/>
    <text class="tn" x="76" y="422" text-anchor="start" dominant-baseline="central">shared by every activity</text>
    <text class="tn2" x="76" y="442" text-anchor="start" dominant-baseline="central">contract · orders · gates · guidance</text>
    <rect class="box-n" x="60" y="472" width="560" height="56" rx="8"/>
    <text class="tn" x="76" y="490" text-anchor="start" dominant-baseline="central">reference library, read on demand</text>
    <text class="tn2" x="76" y="510" text-anchor="start" dominant-baseline="central">plan/references/ 7 files · plan/templates/ 21 files</text>
  </g>
  <line class="edge r d7" x1="340" y1="548" x2="340" y2="578" marker-end="url(#arrow)"/>
  <g class="r d7">
    <rect class="box-n" x="60" y="588" width="560" height="56" rx="8"/>
    <text class="tn" x="340" y="606" text-anchor="middle" dominant-baseline="central">kernel and hooks, unchanged</text>
    <text class="tn2" x="340" y="626" text-anchor="middle" dominant-baseline="central">receipt · gate resolver · T0 witness · write fence · dispatch receipts</text>
  </g>
</svg>
