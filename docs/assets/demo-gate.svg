  <rect width="652" height="815" rx="10" fill="#0d1117"/>
  <rect width="652" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="652" height="10" fill="#161b22"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/><circle cx="39" cy="18" r="5.5" fill="#febc2e"/><circle cx="58" cy="18" r="5.5" fill="#28c840"/>
  <text x="326" y="23" fill="#7d8590" font-size="12" text-anchor="middle">shapeup-sdlc — GATE L2</text>
  <text class="l l0" x="22" y="72" fill="#7d8590">$ claude</text>
  <text class="l l1" x="22" y="93" fill="#f0f6fc">&gt; /ship "add dark mode"</text>
  <text class="l l3" x="22" y="135" fill="#7d8590">  GATE L0   intake + config ................. ok</text>
  <text class="l l4" x="22" y="156" fill="#7d8590">  GATE L1a  orient (code surface, risk) ..... ok</text>
  <text class="l l5" x="22" y="177" fill="#7d8590">  GATE L1a.5 wiring map: 4 use cases ........ ok</text>
  <text class="l l6" x="22" y="198" fill="#7d8590">  GATE L1b  board: 4 tasks .................. ok</text>
  <text class="l l8" x="22" y="240" fill="#3fb950">  BUILD  TASK-001  tokens ........... ✅ T0 green</text>
  <text class="l l9" x="22" y="261" fill="#3fb950">  BUILD  TASK-002  toggle-ui ........ ✅ T0 green</text>
  <text class="l l10" x="22" y="282" fill="#d29922">  BUILD  TASK-003  persist .......... ⬜ ready</text>
  <text class="l l11" x="22" y="303" fill="#d29922">  BUILD  TASK-004  wiring ........... 🔄 in-progress</text>
  <text class="l l13" x="22" y="345" fill="#f0f6fc">&gt; looks good — running EVAL now</text>
  <text class="l l14" x="22" y="366" fill="#7d8590">  (the agent decides it is done. it is not.)</text>
  <text class="l l16" x="22" y="408" fill="#d29922">  ⚠ PreToolUse hook — GATE L2   Skill(spec-evaluator)</text>
  <text class="l l17" x="22" y="429" fill="#c9d1d9">     ⚠ GATE L2 — the board is NOT green and the EVAL is proceeding</text>
  <text class="l l18" x="22" y="450" fill="#c9d1d9">     anyway. Unfinished (2): TASK-003, TASK-004 EVAL is designed to</text>
  <text class="l l19" x="22" y="471" fill="#c9d1d9">     run once per round, after every task is done. A verdict taken</text>
  <text class="l l20" x="22" y="492" fill="#c9d1d9">     now grades a partial board, so a PASS does not mean the feature</text>
  <text class="l l21" x="22" y="513" fill="#c9d1d9">     is complete — it means the finished part passed. Route back to</text>
  <text class="l l22" x="22" y="534" fill="#c9d1d9">     BUILD (task-executor) to close these, or use --task for a</text>
  <text class="l l23" x="22" y="555" fill="#c9d1d9">     deliberate single-task check.</text>
  <text class="l l25" x="22" y="597" fill="#d2a8ff">  ↑ verbatim stdout from hooks/gate-l2.mjs.</text>
  <text class="l l26" x="22" y="618" fill="#d2a8ff">    Not a prompt. A script that read the board twice,</text>
  <text class="l l27" x="22" y="639" fill="#d2a8ff">    named the offenders, and logged a `warn` row.</text>
  <text class="l l29" x="22" y="681" fill="#3fb950">  BUILD  TASK-003  persist .......... ✅ T0 green</text>
  <text class="l l30" x="22" y="702" fill="#3fb950">  BUILD  TASK-004  wiring ........... ✅ T0 green</text>
  <text class="l l32" x="22" y="744" fill="#f0f6fc">&gt; EVAL</text>
  <text class="l l33" x="22" y="765" fill="#3fb950">  ✅ allowed — board green, 4/4</text>
  <text class="l l34" x="22" y="786" fill="#79c0ff">  hill 4/4 · derived from T0 artifacts, not self-report</text>
  <rect class="cur" x="22" y="797" width="8.7" height="14" fill="#3fb950"/>
</svg>
