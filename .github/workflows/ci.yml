name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate plugin & marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Show CLI version
        run: claude --version

      - name: Validate plugin manifest
        run: claude plugin validate . --strict

      - name: Validate marketplace manifest
        run: claude plugin validate ./.claude-plugin/marketplace.json --strict

  json-lint:
    name: Lint JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JSON files parse
        run: |
          set -e
          find . -path ./.git -prune -o -name '*.json' -print | while read -r f; do
            echo "Checking $f"
            python3 -c "import json,sys; json.load(open('$f'))"
          done

  structural-tests:
    name: Structural tests (frontmatter, refs, versions, eval-contract oracles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zero-dependency, no network, no Claude calls — see tests/README.md (Tier 0).
      - name: Run structural test suite
        run: node tests/structural.mjs

  eval-gate:
    name: Eval gate (NOT ACTIVE — no behavioral eval layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: State honestly that there is no behavioral eval layer
        run: |
          echo "There is no Tier-1 activation layer and no Day-1/Day-2 evidence layer in this repo."
          echo "They existed and were removed deliberately; nothing here measures skill activation"
          echo "or craft quality, and no CI check enforces the honesty invariant on such numbers."
          echo "Structural (Tier-0) coverage is the gate that actually runs — see the test job."
          # Exits 0: a placeholder must not give a false sense of coverage by failing either.
