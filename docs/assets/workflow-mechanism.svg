<svg width="100%" viewBox="0 0 1160 791" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>The shapeup-sdlc harness pipeline: idea to ship</title>
  <desc>
    A raw idea flows through Shaping into a Pitch, decided at the Betting Table: Bet
    continues to build, Reject loops back to raw idea. The tech-lead orchestrator then
    runs Kick-off and Orient behind gates L0 and L1a, Wire behind gate L1a.5, Map Scopes
    behind gate L1b, and Build Vertically, whose scopes build concurrently and are
    T0-verified. Evaluate follows, advised by advisory gate L2 and gated by gate L3's
    verdict: FAIL loops back to Build Vertically for round r+1, PASS continues to QA Edge
    Hunt. A circuit breaker can route directly from the build/evaluate loop to Ship and
    Triage at GATE H when the round budget or wall-clock budget runs out, bypassing QA
    and shipping what is green. Ship and Triage passes through GATE H and then GATE L4
    sign-off into Coach Retro, which records feedback in the team knowledge base.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    :root {
      --plan-fill: #e3f2fd;  --plan-stroke: #1e88e5; --plan-ink: #0c447c; --plan-ink2: #185fa5;
      --build-fill: #e8f5e9; --build-stroke: #43a047; --build-ink: #27500a; --build-ink2: #3b6d11;
      --qa-fill: #fce4ec;    --qa-stroke: #c2185b;    --qa-ink: #72243e;   --qa-ink2: #993556;
      --n-fill: #f1efe8;     --n-stroke: #5f5e5a;     --n-ink: #2c2c2a;    --n-ink2: #5f5e5a;
      --hair: #888780;
      --gate-fill: #faeeda;  --gate-stroke: #854f0b;  --gate-ink: #633806;
      --loop: #d85a30;
      --breaker: #ba7517;
      --region: #888780;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --plan-fill: #0c447c;  --plan-stroke: #85b7eb; --plan-ink: #e6f1fb; --plan-ink2: #b5d4f4;
        --build-fill: #27500a; --build-stroke: #97c459; --build-ink: #eaf3de; --build-ink2: #c0dd97;
        --qa-fill: #72243e;    --qa-stroke: #ed93b1;    --qa-ink: #fbeaf0;   --qa-ink2: #f4c0d1;
        --n-fill: #444441;     --n-stroke: #b4b2a9;     --n-ink: #f1efe8;    --n-ink2: #d3d1c7;
        --hair: #a8a79f;
        --gate-fill: #633806;  --gate-stroke: #ef9f27;  --gate-ink: #fac775;
        --loop: #f0997b;
        --breaker: #ef9f27;
        --region: #a8a79f;
      }
    }

    .plan-box  { fill: var(--plan-fill);  stroke: var(--plan-stroke);  stroke-width: .5; }
    .build-box { fill: var(--build-fill); stroke: var(--build-stroke); stroke-width: .5; }
    .qa-box    { fill: var(--qa-fill);    stroke: var(--qa-stroke);    stroke-width: .5; }
    .n-box     { fill: var(--n-fill);     stroke: var(--n-stroke);     stroke-width: .5; }

    .t-plan  { fill: var(--plan-ink);  font: 500 14px system-ui, sans-serif; }
    .ts-plan { fill: var(--plan-ink2); font: 400 12px system-ui, sans-serif; }
    .t-build  { fill: var(--build-ink);  font: 500 14px system-ui, sans-serif; }
    .ts-build { fill: var(--build-ink2); font: 400 12px system-ui, sans-serif; }
    .t-qa  { fill: var(--qa-ink);  font: 500 14px system-ui, sans-serif; }
    .ts-qa { fill: var(--qa-ink2); font: 400 12px system-ui, sans-serif; }
    .t-n  { fill: var(--n-ink);  font: 500 14px system-ui, sans-serif; }
    .ts-n { fill: var(--n-ink2); font: 400 12px system-ui, sans-serif; }

    .edge  { fill: none; stroke: var(--hair); stroke-width: .5; }
    .label { fill: var(--n-ink2); font: 400 12px system-ui, sans-serif; }
    .label-sm { fill: var(--n-ink2); font: 400 11px system-ui, sans-serif; }

    .gate-pill { fill: var(--gate-fill); stroke: var(--gate-stroke); stroke-width: .5; }
    .gate-text { fill: var(--gate-ink); font: 500 12px system-ui, sans-serif; }
    .gate-adv  { fill: none; stroke: var(--gate-stroke); stroke-width: .75; stroke-dasharray: 3 3; }

    .region { fill: none; stroke: var(--region); stroke-width: .5; stroke-dasharray: 4 4; }
    .region-label { fill: var(--n-ink2); font: 400 12px system-ui, sans-serif; }

    .note-box { fill: none; stroke: var(--hair); stroke-width: .5; stroke-dasharray: 2 3; }
    .note-text { fill: var(--n-ink2); font: 400 11px system-ui, sans-serif; }
    .leader { fill: none; stroke: var(--hair); stroke-width: .5; stroke-dasharray: 2 2; }

    .swatch-plan  { fill: var(--plan-fill);  stroke: var(--plan-stroke);  stroke-width: .5; }
    .swatch-build { fill: var(--build-fill); stroke: var(--build-stroke); stroke-width: .5; }
    .swatch-qa    { fill: var(--qa-fill);    stroke: var(--qa-stroke);    stroke-width: .5; }
    .legend-text  { fill: var(--n-ink2); font: 400 12px system-ui, sans-serif; }

    /* Motion: dash-march along every edge, staggered in dependency order so the
       reader sees upstream steps lead. Declared inside no-preference so the resting
       picture -- a screenshot, a PDF export, a reduced-motion reader -- is the
       finished diagram, not a blank one. */
    .flow    { stroke-dasharray: 5 5; }
    .loop    { stroke: var(--loop);    stroke-dasharray: 4 4; }
    .breaker { stroke: var(--breaker); stroke-width: 1; stroke-dasharray: 2 5; }
    @keyframes march { to { stroke-dashoffset: -20; } }
    @media (prefers-reduced-motion: no-preference) {
      .flow, .loop, .breaker { animation: march 1.6s linear infinite; }
      .e0  { animation-delay: 0s; }
      .e1  { animation-delay: .15s; }
      .e2  { animation-delay: .3s; }
      .e3  { animation-delay: .45s; }
      .e4  { animation-delay: .6s; }
      .e5  { animation-delay: .75s; }
      .e6  { animation-delay: .9s; }
      .e7  { animation-delay: 1.05s; }
      .e8  { animation-delay: 1.2s; }
      .e9  { animation-delay: 1.35s; }
      .e10 { animation-delay: 1.5s; }
      .e11 { animation-delay: 1.65s; }
      .e12 { animation-delay: 1.8s; }
      .e13 { animation-delay: 1.95s; }
      .e-reject  { animation-delay: .3s; }
      .e-fail    { animation-delay: 1.5s; }
      .e-breaker { animation-delay: 1.2s; }
    }
  </style>

  <!-- orchestration scope backdrop, drawn first so nodes sit on top -->
  <rect class="region" x="60" y="180" width="1040" height="430" rx="16"/>
  <text class="region-label" font-size="12" x="150" y="195" dominant-baseline="central">/tech-lead orchestrates: Kick-off &#8594; Ship</text>

  <!-- ROW 1: Raw idea -> Shaping -> Pitch -> Betting Table -->
  <g>
    <rect class="n-box" x="115" y="88" width="120" height="40" rx="20"/>
    <text class="t-n" font-size="14" font-weight="500" x="175" y="108" text-anchor="middle" dominant-baseline="central">Raw idea</text>
  </g>
  <line class="edge flow e0" x1="235" y1="108" x2="345" y2="108" marker-end="url(#arrow)"/>

  <g>
    <rect class="plan-box" x="355" y="80" width="180" height="56" rx="8"/>
    <text class="t-plan" font-size="14" font-weight="500" x="445" y="98" text-anchor="middle" dominant-baseline="central">Shaping</text>
    <text class="ts-plan" font-size="12" x="445" y="120" text-anchor="middle" dominant-baseline="central">/shapeup</text>
  </g>
  <line class="edge flow e1" x1="535" y1="108" x2="640" y2="108" marker-end="url(#arrow)"/>

  <g>
    <rect class="n-box" x="650" y="86" width="130" height="44" rx="8"/>
    <text class="t-n" font-size="14" font-weight="500" x="715" y="108" text-anchor="middle" dominant-baseline="central">Pitch</text>
  </g>
  <line class="edge flow e2" x1="780" y1="108" x2="880" y2="108" marker-end="url(#arrow)"/>

  <g>
    <polygon class="n-box" points="985,53 1080,108 985,163 890,108"/>
    <text class="t-n" font-size="14" font-weight="500" x="985" y="99" text-anchor="middle" dominant-baseline="central">Betting Table</text>
    <text class="ts-n" font-size="12" x="985" y="117" text-anchor="middle" dominant-baseline="central">(PO)</text>
  </g>

  <!-- Reject: Betting Table left vertex back up to Raw idea -->
  <path class="edge loop e-reject" d="M890,108 L860,108 L860,175 L175,175 L175,138" marker-end="url(#arrow)"/>
  <text class="label" font-size="12" x="500" y="167" text-anchor="middle" dominant-baseline="central">Reject</text>

  <!-- Bet: Betting Table bottom vertex down through L0, L1a into Kick-off + Orient -->
  <path class="edge flow e3" d="M985,163 L985,185"/>
  <text class="label-sm" font-size="11" x="1000" y="177" text-anchor="start" dominant-baseline="central">Bet</text>
  <g>
    <rect class="gate-pill" x="950" y="185" width="70" height="22" rx="11"/>
    <text class="gate-text" font-size="12" font-weight="500" x="985" y="196" text-anchor="middle" dominant-baseline="central">L0</text>
  </g>
  <path class="edge flow e4" d="M985,207 L985,225"/>
  <g>
    <rect class="gate-pill" x="950" y="225" width="70" height="22" rx="11"/>
    <text class="gate-text" font-size="12" font-weight="500" x="985" y="236" text-anchor="middle" dominant-baseline="central">L1a</text>
  </g>
  <path class="edge flow e5" d="M985,247 L985,322" marker-end="url(#arrow)"/>

  <!-- ROW 2: Kick-off + Orient <- Wire <- Map Scopes <- Build Vertically -->
  <g>
    <rect class="build-box" x="885" y="322" width="200" height="56" rx="8"/>
    <text class="t-build" font-size="14" font-weight="500" x="985" y="340" text-anchor="middle" dominant-baseline="central">Kick-off + Orient</text>
    <text class="ts-build" font-size="12" x="985" y="362" text-anchor="middle" dominant-baseline="central">/orient</text>
  </g>
  <line class="edge flow e6" x1="885" y1="350" x2="880" y2="350"/>
  <g>
    <rect class="gate-pill" x="810" y="339" width="70" height="22" rx="11"/>
    <text class="gate-text" font-size="12" font-weight="500" x="845" y="350" text-anchor="middle" dominant-baseline="central">L1a.5</text>
  </g>
  <line class="edge flow e6" x1="810" y1="350" x2="805" y2="350" marker-end="url(#arrow)"/>

  <g>
    <rect class="plan-box" x="625" y="322" width="180" height="56" rx="8"/>
    <text class="t-plan" font-size="14" font-weight="500" x="715" y="340" text-anchor="middle" dominant-baseline="central">Wire</text>
    <text class="ts-plan" font-size="12" x="715" y="362" text-anchor="middle" dominant-baseline="central">/solution-architect</text>
  </g>
  <line class="edge flow e7" x1="625" y1="350" x2="615" y2="350"/>
  <g>
    <rect class="gate-pill" x="545" y="339" width="70" height="22" rx="11"/>
    <text class="gate-text" font-size="12" font-weight="500" x="580" y="350" text-anchor="middle" dominant-baseline="central">L1b</text>
  </g>
  <line class="edge flow e7" x1="545" y1="350" x2="535" y2="350" marker-end="url(#arrow)"/>

  <g>
    <rect class="plan-box" x="355" y="315" width="180" height="70" rx="8"/>
    <text class="t-plan" font-size="14" font-weight="500" x="445" y="333" text-anchor="middle" dominant-baseline="central">Map Scopes</text>
    <text class="ts-plan" font-size="12" x="445" y="352" text-anchor="middle" dominant-baseline="central">/ba-pitch-analyzer</text>
    <text class="ts-plan" font-size="12" x="445" y="369" text-anchor="middle" dominant-baseline="central">+ /scope-architect</text>
  </g>
  <line class="edge flow e8" x1="355" y1="350" x2="265" y2="350" marker-end="url(#arrow)"/>

  <g>
    <rect class="build-box" x="85" y="322" width="180" height="56" rx="8"/>
    <text class="t-build" font-size="14" font-weight="500" x="175" y="340" text-anchor="middle" dominant-baseline="central">Build Vertically</text>
    <text class="ts-build" font-size="12" x="175" y="362" text-anchor="middle" dominant-baseline="central">/task-executor</text>
  </g>

  <!-- footnote: per-scope attempt budget -->
  <line class="leader" x1="220" y1="378" x2="228" y2="392"/>
  <circle cx="220" cy="378" r="2" fill="var(--hair)"/>
  <rect class="note-box" x="222" y="388" width="264" height="30" rx="6"/>
  <text class="note-text" font-size="11" x="234" y="399">
    <tspan x="234">attempt_budget exhausted &#8594;</tspan>
    <tspan x="234" dy="1.2em">queues a GATE H proposal</tspan>
  </text>

  <!-- Build -> advisory L2 -> Evaluate -->
  <path class="edge flow e9" d="M175,378 L175,390"/>
  <g>
    <rect class="gate-adv" x="140" y="390" width="70" height="22" rx="11"/>
    <text class="gate-text" font-size="12" font-weight="500" x="175" y="401" text-anchor="middle" dominant-baseline="central">L2</text>
  </g>
  <path class="edge flow e9" d="M175,412 L175,522" marker-end="url(#arrow)"/>

  <!-- FAIL: Evaluate back to Build Vertically -->
  <path class="edge loop e-fail" d="M85,550 L60,550 L60,350 L85,350" marker-end="url(#arrow)"/>
  <circle cx="60" cy="480" r="2.5" fill="var(--breaker)"/>
  <text class="label" font-size="12" x="140" y="505" text-anchor="middle" dominant-baseline="central">FAIL &#8594; round r+1</text>

  <!-- circuit breaker: build/eval loop straight to Ship &amp; Triage, bypassing QA -->
  <path class="edge breaker e-breaker" d="M60,480 L715,480 L715,522" marker-end="url(#arrow)"/>
  <text class="label-sm" font-size="11" x="387" y="452" text-anchor="middle" dominant-baseline="central">round_budget or wall-clock exhausted</text>
  <text class="label-sm" font-size="11" x="387" y="466" text-anchor="middle" dominant-baseline="central">&#8594; ship what's green (GATE H)</text>

  <!-- ROW 3: Evaluate -> QA Edge Hunt -> Ship &amp; Triage -> Ship Sign-off -->
  <g>
    <rect class="qa-box" x="85" y="522" width="180" height="56" rx="8"/>
    <text class="t-qa" font-size="14" font-weight="500" x="175" y="540" text-anchor="middle" dominant-baseline="central">Evaluate</text>
    <text class="ts-qa" font-size="12" x="175" y="562" text-anchor="middle" dominant-baseline="central">/spec-evaluator</text>
  </g>
  <line class="edge flow e10" x1="265" y1="550" x2="275" y2="550"/>
  <g>
    <rect class="gate-pill" x="275" y="539" width="70" height="22" rx="11"/>
    <text class="gate-text" font-size="12" font-weight="500" x="310" y="550" text-anchor="middle" dominant-baseline="central">L3</text>
  </g>
  <line class="edge flow e10" x1="345" y1="550" x2="355" y2="550" marker-end="url(#arrow)"/>

  <g>
    <rect class="n-box" x="355" y="522" width="180" height="56" rx="8"/>
    <text class="t-n" font-size="14" font-weight="500" x="445" y="540" text-anchor="middle" dominant-baseline="central">QA Edge Hunt</text>
    <text class="ts-n" font-size="12" x="445" y="562" text-anchor="middle" dominant-baseline="central">/qa-edge-hunter</text>
  </g>
  <line class="edge flow e11" x1="535" y1="550" x2="545" y2="550"/>
  <g>
    <rect class="gate-pill" x="545" y="539" width="70" height="22" rx="11"/>
    <text class="gate-text" font-size="12" font-weight="500" x="580" y="550" text-anchor="middle" dominant-baseline="central">GATE H</text>
  </g>
  <line class="edge flow e11" x1="615" y1="550" x2="625" y2="550" marker-end="url(#arrow)"/>

  <g>
    <rect class="n-box" x="625" y="522" width="180" height="56" rx="8"/>
    <text class="t-n" font-size="14" font-weight="500" x="715" y="540" text-anchor="middle" dominant-baseline="central">Ship &amp; Triage</text>
    <text class="ts-n" font-size="12" x="715" y="562" text-anchor="middle" dominant-baseline="central">/scope-hammer</text>
  </g>
  <line class="edge flow e12" x1="805" y1="550" x2="815" y2="550"/>
  <g>
    <rect class="gate-pill" x="815" y="539" width="70" height="22" rx="11"/>
    <text class="gate-text" font-size="12" font-weight="500" x="850" y="550" text-anchor="middle" dominant-baseline="central">L4</text>
  </g>
  <line class="edge flow e12" x1="885" y1="550" x2="895" y2="550" marker-end="url(#arrow)"/>

  <g>
    <rect class="n-box" x="895" y="528" width="180" height="44" rx="8"/>
    <text class="t-n" font-size="14" font-weight="500" x="985" y="550" text-anchor="middle" dominant-baseline="central">Ship Sign-off</text>
  </g>

  <!-- ROW 4: Coach Retro -->
  <line class="edge flow e13" x1="985" y1="572" x2="985" y2="650" marker-end="url(#arrow)"/>
  <g>
    <rect class="n-box" x="895" y="650" width="180" height="56" rx="8"/>
    <text class="t-n" font-size="14" font-weight="500" x="985" y="668" text-anchor="middle" dominant-baseline="central">Coach Retro</text>
    <text class="ts-n" font-size="12" x="985" y="690" text-anchor="middle" dominant-baseline="central">/coach</text>
  </g>

  <!-- legend -->
  <g>
    <rect class="swatch-plan" x="60" y="745" width="16" height="16" rx="3"/>
    <text class="legend-text" font-size="12" x="82" y="753" dominant-baseline="central">Plan</text>
  </g>
  <g>
    <rect class="swatch-build" x="268" y="745" width="16" height="16" rx="3"/>
    <text class="legend-text" font-size="12" x="290" y="753" dominant-baseline="central">Build</text>
  </g>
  <g>
    <rect class="swatch-qa" x="476" y="745" width="16" height="16" rx="3"/>
    <text class="legend-text" font-size="12" x="498" y="753" dominant-baseline="central">QA</text>
  </g>
  <g>
    <rect class="gate-pill" x="684" y="745" width="40" height="16" rx="8"/>
    <text class="legend-text" font-size="12" x="732" y="753" dominant-baseline="central">Gate (blocking)</text>
  </g>
  <g>
    <rect class="gate-adv" x="932" y="745" width="40" height="16" rx="8"/>
    <text class="legend-text" font-size="12" x="980" y="753" dominant-baseline="central">L2 (advisory)</text>
  </g>
</svg>
