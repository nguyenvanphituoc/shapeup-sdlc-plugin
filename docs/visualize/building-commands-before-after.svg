<svg width="100%" viewBox="0 0 680 606" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>The plugin's ten slash commands today, and what the user types for each after eight are removed</title>
  <desc>Two commands stay: ship, the one entry point, and retro, which also runs before any run. Five commands are second names for a skill and are replaced by the skill's own name: shape by shapeup, orient by the orient skill, build by task-executor, eval by spec-evaluator, qa by qa-edge-hunter. Three are second names for a sub-command of ship: scopes and wire by ship plan, hammer by ship stop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    :root {
      --hair: #888780; --lbl: #444441; --lbl2: #5F5E5A;
      --n-fill: #F1EFE8; --n-ink: #444441; --n-ink2: #5F5E5A;
      --c-fill: #FAECE7; --c-edge: #993C1D; --c-ink: #712B13; --c-ink2: #993C1D;
      --t-fill: #E1F5EE; --t-edge: #0F6E56; --t-ink: #085041; --t-ink2: #0F6E56;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --hair: #888780; --lbl: #D3D1C7; --lbl2: #B4B2A9;
        --n-fill: #2C2C2A; --n-ink: #D3D1C7; --n-ink2: #B4B2A9;
        --c-fill: #712B13; --c-edge: #F0997B; --c-ink: #F5C4B3; --c-ink2: #F0997B;
        --t-fill: #085041; --t-edge: #5DCAA5; --t-ink: #9FE1CB; --t-ink2: #5DCAA5;
      }
    }
    .bound { fill: none; stroke: var(--hair); stroke-width: .5; stroke-dasharray: 4 4; }
    .cont  { fill: none; stroke: var(--hair); stroke-width: .5; }
    .box-n { fill: var(--n-fill); stroke: var(--hair); stroke-width: .5; }
    .box-c { fill: var(--c-fill); stroke: var(--c-edge); stroke-width: 1; stroke-dasharray: 4 3; }
    .box-t { fill: var(--t-fill); stroke: var(--t-edge); stroke-width: .5; }
    .edge  { fill: none; stroke: var(--hair); stroke-width: .5; }
    .lbl   { fill: var(--lbl);  font: 500 14px system-ui, sans-serif; }
    .lbl2  { fill: var(--lbl2); font: 400 12px system-ui, sans-serif; }
    .tn    { fill: var(--n-ink);  font: 500 14px system-ui, sans-serif; }
    .tn2   { fill: var(--n-ink2); font: 400 12px system-ui, sans-serif; }
    .tc2   { fill: var(--c-ink);  font: 400 12px system-ui, sans-serif; }
    .tt    { fill: var(--t-ink);  font: 500 14px system-ui, sans-serif; }
    .tt2   { fill: var(--t-ink2); font: 400 12px system-ui, sans-serif; }
    /* Staged reveal, containers before contents, in the order a run reaches them. It plays
       once; the markup itself is the finished picture. */
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: no-preference) {
      .r  { animation: reveal .45s ease-out both; }
      .d1 { animation-delay: .2s; }  .d2 { animation-delay: .4s; }
      .d3 { animation-delay: .6s; }  .d4 { animation-delay: .8s; }
      .d5 { animation-delay: 1s; }   .d6 { animation-delay: 1.2s; }
      .d7 { animation-delay: 1.4s; }
    }
    .tc { fill: var(--c-ink); font: 500 14px system-ui, sans-serif; }
    @media (prefers-reduced-motion: no-preference) {
      .e0 { animation-delay: 0.00s; }
      .e1 { animation-delay: 0.15s; }
      .e2 { animation-delay: 0.30s; }
      .e3 { animation-delay: 0.45s; }
      .e4 { animation-delay: 0.60s; }
      .e5 { animation-delay: 0.75s; }
      .e6 { animation-delay: 0.90s; }
      .e7 { animation-delay: 1.05s; }
      .e8 { animation-delay: 1.20s; }
      .e9 { animation-delay: 1.35s; }
    }
  </style>
  <text class="lbl2" x="60" y="36" text-anchor="start" dominant-baseline="central">today · 10 files</text>
  <text class="lbl2" x="230" y="36" text-anchor="start" dominant-baseline="central">after · 2 command files and the 6 skills</text>
  <g class="r e0">
    <rect class="box-n" x="60" y="56" width="130" height="44" rx="8"/>
    <text class="tn" x="125" y="78" text-anchor="middle" dominant-baseline="central">/ship</text>
    <line class="edge" x1="190" y1="78" x2="220" y2="78" marker-end="url(#arrow)"/>
    <rect class="box-n" x="230" y="56" width="390" height="44" rx="8"/>
    <text class="tn" x="246" y="78" text-anchor="start" dominant-baseline="central">/ship · kept, the one entry point</text>
  </g>
  <g class="r e1">
    <rect class="box-n" x="60" y="110" width="130" height="44" rx="8"/>
    <text class="tn" x="125" y="132" text-anchor="middle" dominant-baseline="central">/retro</text>
    <line class="edge" x1="190" y1="132" x2="220" y2="132" marker-end="url(#arrow)"/>
    <rect class="box-n" x="230" y="110" width="390" height="44" rx="8"/>
    <text class="tn" x="246" y="132" text-anchor="start" dominant-baseline="central">/retro · kept, also runs before any run</text>
  </g>
  <g class="r e2">
    <rect class="box-c" x="60" y="164" width="130" height="44" rx="8"/>
    <text class="tc" x="125" y="186" text-anchor="middle" dominant-baseline="central">/shape</text>
    <line class="edge" x1="190" y1="186" x2="220" y2="186" marker-end="url(#arrow)"/>
    <rect class="box-t" x="230" y="164" width="390" height="44" rx="8"/>
    <text class="tt" x="246" y="186" text-anchor="start" dominant-baseline="central">/shapeup · the skill's own name</text>
  </g>
  <g class="r e3">
    <rect class="box-c" x="60" y="218" width="130" height="44" rx="8"/>
    <text class="tc" x="125" y="240" text-anchor="middle" dominant-baseline="central">/orient</text>
    <line class="edge" x1="190" y1="240" x2="220" y2="240" marker-end="url(#arrow)"/>
    <rect class="box-t" x="230" y="218" width="390" height="44" rx="8"/>
    <text class="tt" x="246" y="240" text-anchor="start" dominant-baseline="central">/orient · the skill of the same name</text>
  </g>
  <g class="r e4">
    <rect class="box-c" x="60" y="272" width="130" height="44" rx="8"/>
    <text class="tc" x="125" y="294" text-anchor="middle" dominant-baseline="central">/build</text>
    <line class="edge" x1="190" y1="294" x2="220" y2="294" marker-end="url(#arrow)"/>
    <rect class="box-t" x="230" y="272" width="390" height="44" rx="8"/>
    <text class="tt" x="246" y="294" text-anchor="start" dominant-baseline="central">/task-executor · the skill's own name</text>
  </g>
  <g class="r e5">
    <rect class="box-c" x="60" y="326" width="130" height="44" rx="8"/>
    <text class="tc" x="125" y="348" text-anchor="middle" dominant-baseline="central">/eval</text>
    <line class="edge" x1="190" y1="348" x2="220" y2="348" marker-end="url(#arrow)"/>
    <rect class="box-t" x="230" y="326" width="390" height="44" rx="8"/>
    <text class="tt" x="246" y="348" text-anchor="start" dominant-baseline="central">/spec-evaluator · the skill's own name</text>
  </g>
  <g class="r e6">
    <rect class="box-c" x="60" y="380" width="130" height="44" rx="8"/>
    <text class="tc" x="125" y="402" text-anchor="middle" dominant-baseline="central">/qa</text>
    <line class="edge" x1="190" y1="402" x2="220" y2="402" marker-end="url(#arrow)"/>
    <rect class="box-t" x="230" y="380" width="390" height="44" rx="8"/>
    <text class="tt" x="246" y="402" text-anchor="start" dominant-baseline="central">/qa-edge-hunter · the skill's own name</text>
  </g>
  <g class="r e7">
    <rect class="box-c" x="60" y="434" width="130" height="44" rx="8"/>
    <text class="tc" x="125" y="456" text-anchor="middle" dominant-baseline="central">/scopes</text>
    <line class="edge" x1="190" y1="456" x2="220" y2="456" marker-end="url(#arrow)"/>
    <rect class="box-t" x="230" y="434" width="390" height="44" rx="8"/>
    <text class="tt" x="246" y="456" text-anchor="start" dominant-baseline="central">/ship plan · stops at Board Review</text>
  </g>
  <g class="r e8">
    <rect class="box-c" x="60" y="488" width="130" height="44" rx="8"/>
    <text class="tc" x="125" y="510" text-anchor="middle" dominant-baseline="central">/wire</text>
    <line class="edge" x1="190" y1="510" x2="220" y2="510" marker-end="url(#arrow)"/>
    <rect class="box-t" x="230" y="488" width="390" height="44" rx="8"/>
    <text class="tt" x="246" y="510" text-anchor="start" dominant-baseline="central">/ship plan · the PO stops at Wiring Review</text>
  </g>
  <g class="r e9">
    <rect class="box-c" x="60" y="542" width="130" height="44" rx="8"/>
    <text class="tc" x="125" y="564" text-anchor="middle" dominant-baseline="central">/hammer</text>
    <line class="edge" x1="190" y1="564" x2="220" y2="564" marker-end="url(#arrow)"/>
    <rect class="box-t" x="230" y="542" width="390" height="44" rx="8"/>
    <text class="tt" x="246" y="564" text-anchor="start" dominant-baseline="central">/ship stop · the Cut-List Review census</text>
  </g>
</svg>
