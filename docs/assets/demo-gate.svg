8.022%,100%{opacity:1}}.l33{animation:r33 23.250000000000007s steps(1,end) infinite}@keyframes r34{0%,80.387%{opacity:0}81.075%,100%{opacity:1}}.l34{animation:r34 23.250000000000007s steps(1,end) infinite}
